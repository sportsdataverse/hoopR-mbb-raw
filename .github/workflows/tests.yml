name: tests

# Offline test gate, mirroring the wehoop-wbb-raw template. Without it the
# suite only runs inside the nightly scrape, so it gates nothing: a broken
# import or a reintroduced type=bool would ship and be discovered by a failing
# cron. These tests touch no network.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The archive is huge; a full checkout spends minutes cloning and
          # never reaches the tests. Sparse-checkout the code only and skip
          # mbb/ entirely -- which is why the archive-backed tests are marked
          # and deselected below.
          sparse-checkout: |
            python
            tests
            scripts
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.12'
          cache-dependency-glob: uv.lock

      - name: Install
        # --frozen: a PR must not silently re-resolve the lockfile.
        run: uv sync --frozen --dev

      - name: Tests
        # `archive` tests read the committed mbb/ tree, which isn't checked
        # out here.
        run: uv run --no-sync pytest -q -m "not archive"

      - name: Lint
        run: uv run --no-sync ruff check python tests

      - name: Shell syntax
        # scripts/ is bash-only by convention; the scrape entry points are not
        # otherwise exercised by CI.
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
