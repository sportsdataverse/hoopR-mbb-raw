on: [push, workflow_dispatch]

name: hoopR MBB Data trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    hoopR_mbb_data_trigger:
        runs-on: ubuntu-latest
        # `on: push` has no branch filter here, and the dispatch payload is hardcoded to
        # refs/heads/main, so a feature-branch or tag push started a production build of
        # work that had not landed (cfbfastR-cfb-raw#10). Same guard as that repo.
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Trigger hoopR MBB Data
              uses: peter-evans/repository-dispatch@v4
              with:
                  token: ${{ secrets.SDV_GH_TOKEN }}
                  repository: sportsdataverse/hoopR-mbb-data
                  event-type: daily_mbb_data
                  client-payload: |-
                    {
                      "ref": "refs/heads/main",
                      "event_name": "daily_mbb_data",
                      "commit_message": ${{ toJSON(github.event.head_commit.message) }}
                    }
